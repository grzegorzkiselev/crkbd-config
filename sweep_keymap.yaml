# https://keymap-drawer.streamlit.app/

layout: {qmk_keyboard: crkbd/rev1, layout_name: LAYOUT_split_3x6_3}
layers:
  L0:
  - [TAB, Q, W, E, R, T, Y, U, I, O]
  - [P, '[', LSFT, A, S, D, F, G, H, J]
  - - K
    - L
    - ;
    - {t: '''', h: MOD_RSFT}
    - {t: F18, h: MOD_LCTL}
    - Z
    - X
    - C
    - V
    - B
  - - N
    - M
    - ','
    - .
    - /
    - {t: ']', h: MOD_RCTL}
    - LALT
    - LGUI
    - L2
    - L1
  - - SPC
    - {t: \, h: MOD_RALT}
  L1:
  - [TAB, BSPC, ESC, UP, DEL, '', '', BSPC, UP, ESC]
  - [DEL, TAB, LSFT, '', LEFT, DOWN, RGHT, ENT, ENT, LEFT]
  - [DOWN, RGHT, '', RSFT, LCTL, BRID, BRIU, UG HUED, UG SATD, UG VALD]
  - - MPRV
    - MPLY
    - MNXT
    - MUTE
    - VOLD
    - {t: VOLU, h: MOD_RCTL}
    - LALT
    - LGUI
    - {t: ▽, type: trans}
    - {type: held}
  - - RGUI
    - {t: \, h: MOD_RALT}
  L2:
  - [Sft+1, Sft+2, Sft+3, Sft+4, Sft+5, Sft+6, Sft+7, Sft+8, Sft+9, Sft+0]
  - [Sft+-, Sft+=, '1', '2', '3', '4', '5', '6', '7', '8']
  - ['9', '0', '-', '=', LCTL, '', '', '', '', '']
  - - ''
    - ''
    - ''
    - ''
    - ''
    - RCTL
    - LALT
    - RGUI
    - {type: held}
    - {t: ▽, type: trans}
  - - RGUI
    - {t: \, h: MOD_RALT}
  L3:
  - [QK BOOTLOADER, MS BTN3, MS BTN2, MS UP, '', MS WHLU, MS WHLU, '', MS UP, MS BTN2]
  - [MS BTN3, SLEP, LSFT, MS BTN1, MS LEFT, MS DOWN, MS RGHT, MS WHLD, MS WHLD, MS LEFT]
  - - MS DOWN
    - MS RGHT
    - MS BTN1
    - RSFT
    - {t: F1, h: MOD_LCTL}
    - F2
    - F3
    - F4
    - F5
    - F6
  - - F7
    - F8
    - F9
    - F10
    - F11
    - {t: F12, h: MOD_RCTL}
    - LALT
    - RGUI
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
  - - RGUI
    - {t: \, h: MOD_RALT}
combos:
  - {p: [28, 36], k: "L3", l: ["L0"]}
  - {p: [29, 37], k: "SPC", l: ["L0"]}
  - {p: [37, 38], k: "L1", l: ["L0"]}
  - {p: [39, 40], k: "L2", l: ["L0"]}
  - {p: [30, 40], k: "RGUI", l: ["L0"]}
  - {p: [31, 41], k: "L3", l: ["L0"]}
  